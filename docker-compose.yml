services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      MIRROR_LISTEN_ADDR: ":8080"
      MIRROR_DATABASE_URL: "postgres://mirror:mirror@db:5432/mirror?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
