name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test & vulncheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mirror
          POSTGRES_PASSWORD: mirror
          POSTGRES_DB: mirror_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirror"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MIRROR_TEST_DATABASE_URL: postgres://mirror:mirror@localhost:5432/mirror_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Mythicove/api
          path: api-specs
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
        env:
          MYTHICOVE_API_SPECS: ${{ github.workspace }}/api-specs/specs
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26"

  sqlc:
    name: sqlc drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: sqlc generate
        run: sqlc generate
      - name: check drift
        run: git diff --exit-code
